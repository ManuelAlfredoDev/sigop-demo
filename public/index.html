<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGOP Demo</title><style>body{margin:0;background:#f5f7fb;color:#18263a;font:16px system-ui}main{max-width:1050px;margin:auto;padding:34px 20px}.tag{color:#075f45;background:#d8f7ea;padding:6px 10px;border-radius:20px;font-weight:700;font-size:.8rem}.head{display:flex;justify-content:space-between;gap:18px;align-items:start}.head h1{margin:12px 0 6px}.muted{color:#65758b}.stats,.layout{display:grid;gap:16px;margin-top:22px}.stats{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1.4fr .8fr}.card{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:18px;box-shadow:0 8px 24px #1234560c}.number{font-size:2rem;font-weight:800}.task{border-left:4px solid #2f73f6;padding:10px 12px;margin:9px 0;background:#f8fbff}.open{border-color:#f59f00}.progress{border-color:#2f73f6}form{display:grid;gap:10px}input,select{padding:10px;border:1px solid #ccd8e6;border-radius:8px}button{padding:10px;border:0;border-radius:8px;background:#276ef1;color:#fff;font-weight:700;cursor:pointer}#activity{min-height:55px;color:#075f45}@media(max-width:700px){.head,.layout{display:block}.stats{grid-template-columns:1fr}.card{margin-top:14px}}</style><body><main><span class="tag">DEMO ENVIRONMENT · FICTIONAL DATA</span><section class="head"><div><h1>SIGOP Demo</h1><p class="muted">Task workflow and realtime coordination patterns with a local simulated MQTT status.</p></div><div class="card"><strong>Realtime</strong><br><span class="muted">Socket.IO connected · MQTT simulated</span></div></section><section class="stats"><div class="card"><div class="number" id="count">0</div><span class="muted">Demo tasks</span></div><div class="card"><div class="number" id="openCount">0</div><span class="muted">Open tasks</span></div><div class="card"><div class="number">100%</div><span class="muted">Fictional data</span></div></section><section class="layout"><article class="card"><h2>Task board</h2><div id="tasks"></div></article><aside class="card"><h2>Create a demo task</h2><form id="form"><input id="title" required placeholder="Example: Review demo alert"><select id="status"><option>open</option><option>in progress</option></select><button>Create fictional task</button></form><h3>Activity</h3><div id="activity">Waiting for a local event.</div></aside></section></main><script src="/socket.io/socket.io.js"></script><script>let all=[];const tasks=document.querySelector('#tasks'),count=document.querySelector('#count'),openCount=document.querySelector('#openCount'),form=document.querySelector('#form'),title=document.querySelector('#title'),status=document.querySelector('#status'),activity=document.querySelector('#activity');function render(){count.textContent=all.length;openCount.textContent=all.filter(t=>t.status==='open').length;tasks.innerHTML=all.map(t=>`<div class="task ${t.status==='open'?'open':'progress'}"><b>${t.id}</b><br>${t.title}<br><small>${t.team} · ${t.status}</small></div>`).join('')}async function load(){all=await (await fetch('/api/tasks')).json();render()}form.onsubmit=async e=>{e.preventDefault();let t=await (await fetch('/api/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:title.value,status:status.value})})).json();activity.textContent=`Created ${t.id}: ${t.title}`;title.value='';load()};io().on('task:created',t=>{activity.textContent=`Realtime update: ${t.id} created`;load()});load()</script></body></html>
